# Cypress needs its postinstall script to download its binary. `allowBuilds`
# is the current setting; `onlyBuiltDependencies` is kept for older pnpm 10.
allowBuilds:
  cypress: true
minimumReleaseAgeExclude:
  - mongoose@6.13.13
onlyBuiltDependencies:
  - cypress
# Makes Cypress work in CI (cf. https://github.com/cypress-io/github-action/issues/1363)
sideEffectsCache: false
